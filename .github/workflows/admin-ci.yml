name: Admin CI

on:
  push:
    paths:
      - 'Admin/**'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    paths:
      - 'Admin/**'
      - '.github/workflows/admin-ci.yml'

jobs:
  admin-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
