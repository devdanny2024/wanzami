name: Deploy backend

on:
  push:
    branches: [main, new-backend-testing]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_backend: ${{ steps.tfout.outputs.ecr_backend }}
      cluster_name: ${{ steps.tfout.outputs.cluster_name }}
      backend_service_name: ${{ steps.tfout.outputs.backend_service_name }}
      worker_transcode_service_name: ${{ steps.tfout.outputs.worker_transcode_service_name }}
      worker_cron_service_name: ${{ steps.tfout.outputs.worker_cron_service_name }}
      taskdef_api_family: ${{ steps.tfout.outputs.taskdef_api_family }}
      taskdef_worker_transcode_family: ${{ steps.tfout.outputs.taskdef_worker_transcode_family }}
      taskdef_worker_cron_family: ${{ steps.tfout.outputs.taskdef_worker_cron_family }}
      ecs_sg_id: ${{ steps.tfout.outputs.ecs_sg_id }}
      private_subnets_csv: ${{ steps.tfout.outputs.private_subnets_csv }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write terraform.tfvars from secret
        env:
          # Use a separate tfvars secret for the testing branch so we can iterate safely.
          TERRAFORM_TFVARS: ${{ github.ref_name == 'new-backend-testing' && secrets.TERRAFORM_TFVARS_TESTING || secrets.TERRAFORM_TFVARS }}
        run: |
          set -euo pipefail
          mkdir -p infra/terraform
          printf "%s" "$TERRAFORM_TFVARS" > infra/terraform/terraform.tfvars

          ALB_JSON=$(aws elbv2 describe-load-balancers \
            --region "$AWS_REGION" \
            --names wanzami-backend-alb-new \
            --query 'LoadBalancers[0]' \
            --output json)

          ECS_JSON=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster wanzami-cluster \
            --services wanzami-backend-service-v2 \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)

          TG_JSON=$(aws elbv2 describe-target-groups \
            --region "$AWS_REGION" \
            --load-balancer-arn "$(echo "$ALB_JSON" | jq -r '.LoadBalancerArn')" \
            --query 'TargetGroups[0]' \
            --output json)

          export ALB_JSON ECS_JSON TG_JSON

          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import os

          p = Path('infra/terraform/terraform.tfvars')
          text = p.read_text()

          alb = json.loads(os.environ['ALB_JSON'])
          ecs = json.loads(os.environ['ECS_JSON'])
          tg = json.loads(os.environ['TG_JSON'])

          overrides = {
              'vpc_id': alb['VpcId'],
              'public_subnets': alb['AvailabilityZones'] and [az['SubnetId'] for az in alb['AvailabilityZones']],
              'private_subnets': ecs.get('subnets', []),
              'alb_sg_id': (alb.get('SecurityGroups') or [''])[0],
              'ecs_sg_id': (ecs.get('securityGroups') or [''])[0],
              'backend_tg_name': tg['TargetGroupName'],
              'backend_service_name': 'wanzami-backend-service-v2',
              'worker_transcode_service_name': 'wanzami-worker-transcode-svc-v3',
              'worker_cron_service_name': 'wanzami-worker-cron-service-v3',
              'use_existing_backend_service': True,
              'use_existing_worker_transcode_service': True,
              'use_existing_worker_cron_service': True,
              'existing_db_instance_identifier': 'wanzami-pg-eu-prod-new',
              'existing_redis_replication_group_id': 'wanzami-redis-eu',
              'use_existing_alb': True,
              'use_existing_target_group': True,
              'backend_task_cpu': 1024,
              'backend_task_memory': 2048,
              'backend_desired_count': 2,
              'worker_transcode_desired_count': 1,
              'worker_cron_desired_count': 1,
              'backend_autoscale_min_capacity': 2,
              'backend_autoscale_max_capacity': 4,
          }

          def hcl(v):
              if isinstance(v, bool):
                  return 'true' if v else 'false'
              if isinstance(v, (int, float)):
                  return str(v)
              if isinstance(v, list):
                  return '[' + ', '.join(json.dumps(x) for x in v) + ']'
              return json.dumps(v)

          def upsert(text, key, value):
              rendered = f'{key} = {hcl(value)}\n'
              patterns = [
                  re.compile(rf'(?ms)^\s*{re.escape(key)}\s*=\s*\[[^\]]*\]\s*'),
                  re.compile(rf'(?ms)^\s*{re.escape(key)}\s*=\s*\{{.*?^\}}\s*'),
                  re.compile(rf'(?m)^\s*{re.escape(key)}\s*=\s*.+$'),
              ]
              for pattern in patterns:
                  if pattern.search(text):
                      return pattern.sub(rendered, text, count=1)
              return text.rstrip() + f'\n{rendered}'

          for key, value in overrides.items():
              text = upsert(text, key, value)

          p.write_text(text)
          print('Patched terraform.tfvars with live AWS network IDs and safe backend sizing defaults')
          PY

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      - name: Terraform Outputs
        id: tfout
        working-directory: infra/terraform
        run: |
          echo "ecr_backend=$(terraform output -raw ecr_backend)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "backend_service_name=$(terraform output -raw backend_service_name)" >> "$GITHUB_OUTPUT"
          echo "worker_transcode_service_name=$(terraform output -raw worker_transcode_service_name)" >> "$GITHUB_OUTPUT"
          echo "worker_cron_service_name=$(terraform output -raw worker_cron_service_name)" >> "$GITHUB_OUTPUT"
          echo "taskdef_api_family=$(terraform output -raw taskdef_api_family)" >> "$GITHUB_OUTPUT"
          echo "taskdef_worker_transcode_family=$(terraform output -raw taskdef_worker_transcode_family)" >> "$GITHUB_OUTPUT"
          echo "taskdef_worker_cron_family=$(terraform output -raw taskdef_worker_cron_family)" >> "$GITHUB_OUTPUT"
          echo "ecs_sg_id=$(terraform output -raw ecs_sg_id)" >> "$GITHUB_OUTPUT"
          echo "private_subnets_csv=$(terraform output -raw private_subnets_csv)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPO: ${{ needs.terraform-apply.outputs.ecr_backend }}
      CLUSTER: ${{ needs.terraform-apply.outputs.cluster_name }}
      SERVICE_API: ${{ needs.terraform-apply.outputs.backend_service_name }}
      SERVICE_TRANSCODE: ${{ needs.terraform-apply.outputs.worker_transcode_service_name }}
      SERVICE_CRON: ${{ needs.terraform-apply.outputs.worker_cron_service_name }}
      TASKDEF_API: ${{ needs.terraform-apply.outputs.taskdef_api_family }}
      TASKDEF_TRANSCODE: ${{ needs.terraform-apply.outputs.taskdef_worker_transcode_family }}
      TASKDEF_CRON: ${{ needs.terraform-apply.outputs.taskdef_worker_cron_family }}
      ECS_SG_ID: ${{ needs.terraform-apply.outputs.ecs_sg_id }}
      PRIVATE_SUBNETS_CSV: ${{ needs.terraform-apply.outputs.private_subnets_csv }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t $ECR_REPO:latest -t $ECR_REPO:$IMAGE_TAG ./backend
          docker push $ECR_REPO:latest
          docker push $ECR_REPO:$IMAGE_TAG

      - name: Resolve live data endpoints
        id: live_endpoints
        run: |
          set -euo pipefail
          DB_HOST=$(aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query 'DBInstances[?DBInstanceIdentifier==`wanzami-pg-eu-prod-new`]|[0].Endpoint.Address' \
            --output text)
          DB_SECRET_ARN=$(aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query 'DBInstances[?DBInstanceIdentifier==`wanzami-pg-eu-prod-new`]|[0].MasterUserSecret.SecretArn' \
            --output text)
          DB_SECRET_JSON=$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$DB_SECRET_ARN" \
            --query 'SecretString' \
            --output text)
          DB_USERNAME=$(echo "$DB_SECRET_JSON" | jq -r '.username')
          DB_PASSWORD=$(echo "$DB_SECRET_JSON" | jq -r '.password')
          REDIS_HOST=$(aws elasticache describe-replication-groups \
            --region "$AWS_REGION" \
            --query 'ReplicationGroups[?ReplicationGroupId==`wanzami-redis-eu`]|[0].NodeGroups[0].PrimaryEndpoint.Address' \
            --output text)
          echo "::add-mask::$DB_PASSWORD"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "db_username=$DB_USERNAME" >> "$GITHUB_OUTPUT"
          echo "db_password=$DB_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "redis_host=$REDIS_HOST" >> "$GITHUB_OUTPUT"

      - name: Register API task definition revision
        id: reg_api_td
        run: |
          IMAGE="$ECR_REPO:${GITHUB_SHA}"
          TASKDEF_API_USE=${TASKDEF_API:-wanzami-backend-task}
          DB_HOST="${{ steps.live_endpoints.outputs.db_host }}"
          DB_USERNAME="${{ steps.live_endpoints.outputs.db_username }}"
          DB_PASSWORD="${{ steps.live_endpoints.outputs.db_password }}"
          REDIS_HOST="${{ steps.live_endpoints.outputs.redis_host }}"
          TD=$(aws ecs describe-task-definition --task-definition $TASKDEF_API_USE)
          UPDATED=$(echo "$TD" | jq --arg IMG "$IMAGE" --arg DB_HOST "$DB_HOST" --arg DB_USERNAME "$DB_USERNAME" --arg DB_PASSWORD "$DB_PASSWORD" --arg REDIS_HOST "$REDIS_HOST" '
            .taskDefinition
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMG
            | .containerDefinitions[0].command = ["node", "dist/index.js"]
            | .containerDefinitions[0].environment = (
                (.containerDefinitions[0].environment // [])
                | map(
                    if .name == "DATABASE_URL" then
                      .value = (
                        "postgresql://" + $DB_USERNAME + ":" + ($DB_PASSWORD | @uri) + "@" + $DB_HOST + ":" +
                        (((.value | split("@")[1] // "") | split("/")[0] | split(":") | .[1]) // "5432") + "/" +
                        ((((.value | split("@")[1] // "") | split("/") | .[1:]) | join("/")))
                      )
                    elif .name == "REDIS_URL" and ($REDIS_HOST | length) > 0 then
                      .value |= (
                        (split("://")[0]) + "://" + $REDIS_HOST + ":" +
                        (((split("://")[1] // "") | split("/")[0] | split(":") | .[1]) // "6379") +
                        (if (((split("://")[1] // "") | split("/") | length) > 1)
                         then "/" + (((split("://")[1] // "") | split("/") | .[1:]) | join("/"))
                         else ""
                         end)
                      )
                    else . end
                  )
              )
          ')
          echo "$UPDATED" > /tmp/td-api.json
          REV_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-api.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "api_td_arn=$REV_ARN" >> "$GITHUB_OUTPUT"

      - name: Run Prisma migrations inside ECS (private RDS)
        id: prisma_migrate
        continue-on-error: true
        run: |
          set -euo pipefail

          TD_ARN="${{ steps.reg_api_td.outputs.api_td_arn }}"

          # Build network config JSON for Fargate run-task.
          NETWORK=$(jq -n \
            --arg csv "$PRIVATE_SUBNETS_CSV" \
            --arg sg "$ECS_SG_ID" \
            '{awsvpcConfiguration:{subnets:($csv|split(",")),securityGroups:[$sg],assignPublicIp:"DISABLED"}}')

          # Run migrations using the backend container in the new task definition revision.
          OVERRIDES=$(jq -n \
            '{containerOverrides:[{name:"backend",command:["sh","-lc","set -e; npx prisma migrate deploy || (echo migrate deploy failed, attempting resolve for live engagement migration; npx prisma migrate resolve --applied 20260217224000_live_engagement_chat_reactions || true; npx prisma migrate deploy); npx prisma generate"]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TD_ARN" \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            | jq -r '.tasks[0].containers[] | select(.name=="backend") | .exitCode // empty')

          if [ -z "$EXIT_CODE" ]; then
            echo "Could not read exit code for migration task"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code: $EXIT_CODE"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Warn if migration failed (deployment continues)
        if: steps.prisma_migrate.outcome == 'failure'
        run: |
          echo "WARNING: Prisma migration failed in CI, but service deployment is continuing."

      - name: Update API service
        run: |
          TD_ARN="${{ steps.reg_api_td.outputs.api_td_arn }}"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE_API" --task-definition "$TD_ARN" --force-new-deployment

      - name: Update Transcode worker
        run: |
          IMAGE="$ECR_REPO:${GITHUB_SHA}"
          TASKDEF_TRANSCODE_USE=${TASKDEF_TRANSCODE:-wanzami-worker-transcode}
          DB_HOST="${{ steps.live_endpoints.outputs.db_host }}"
          DB_USERNAME="${{ steps.live_endpoints.outputs.db_username }}"
          DB_PASSWORD="${{ steps.live_endpoints.outputs.db_password }}"
          REDIS_HOST="${{ steps.live_endpoints.outputs.redis_host }}"
          TD=$(aws ecs describe-task-definition --task-definition $TASKDEF_TRANSCODE_USE)
          UPDATED=$(echo "$TD" | jq --arg IMG "$IMAGE" --arg DB_HOST "$DB_HOST" --arg DB_USERNAME "$DB_USERNAME" --arg DB_PASSWORD "$DB_PASSWORD" --arg REDIS_HOST "$REDIS_HOST" '
            .taskDefinition
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMG
            | .containerDefinitions[0].command = ["node", "dist/worker/transcodeWorker.js"]
            | .containerDefinitions[0].environment = (
                (.containerDefinitions[0].environment // [])
                | map(
                    if .name == "DATABASE_URL" then
                      .value = (
                        "postgresql://" + $DB_USERNAME + ":" + ($DB_PASSWORD | @uri) + "@" + $DB_HOST + ":" +
                        (((.value | split("@")[1] // "") | split("/")[0] | split(":") | .[1]) // "5432") + "/" +
                        ((((.value | split("@")[1] // "") | split("/") | .[1:]) | join("/")))
                      )
                    elif .name == "REDIS_URL" and ($REDIS_HOST | length) > 0 then
                      .value |= (
                        (split("://")[0]) + "://" + $REDIS_HOST + ":" +
                        (((split("://")[1] // "") | split("/")[0] | split(":") | .[1]) // "6379") +
                        (if (((split("://")[1] // "") | split("/") | length) > 1)
                         then "/" + (((split("://")[1] // "") | split("/") | .[1:]) | join("/"))
                         else ""
                         end)
                      )
                    else . end
                  )
              )
          ')
          echo "$UPDATED" > /tmp/td-transcode.json
          REV_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-transcode.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster $CLUSTER --service $SERVICE_TRANSCODE --task-definition "$REV_ARN" --force-new-deployment

      - name: Update Cron worker
        run: |
          IMAGE="$ECR_REPO:${GITHUB_SHA}"
          TASKDEF_CRON_USE=${TASKDEF_CRON:-wanzami-worker-cron}
          DB_HOST="${{ steps.live_endpoints.outputs.db_host }}"
          DB_USERNAME="${{ steps.live_endpoints.outputs.db_username }}"
          DB_PASSWORD="${{ steps.live_endpoints.outputs.db_password }}"
          REDIS_HOST="${{ steps.live_endpoints.outputs.redis_host }}"
          TD=$(aws ecs describe-task-definition --task-definition $TASKDEF_CRON_USE)
          UPDATED=$(echo "$TD" | jq --arg IMG "$IMAGE" --arg DB_HOST "$DB_HOST" --arg DB_USERNAME "$DB_USERNAME" --arg DB_PASSWORD "$DB_PASSWORD" --arg REDIS_HOST "$REDIS_HOST" '
            .taskDefinition
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMG
            | .containerDefinitions[0].command = ["node", "dist/worker/cron.js"]
            | .containerDefinitions[0].environment = (
                (.containerDefinitions[0].environment // [])
                | map(
                    if .name == "DATABASE_URL" then
                      .value = (
                        "postgresql://" + $DB_USERNAME + ":" + ($DB_PASSWORD | @uri) + "@" + $DB_HOST + ":" +
                        (((.value | split("@")[1] // "") | split("/")[0] | split(":") | .[1]) // "5432") + "/" +
                        ((((.value | split("@")[1] // "") | split("/") | .[1:]) | join("/")))
                      )
                    elif .name == "REDIS_URL" and ($REDIS_HOST | length) > 0 then
                      .value |= (
                        (split("://")[0]) + "://" + $REDIS_HOST + ":" +
                        (((split("://")[1] // "") | split("/")[0] | split(":") | .[1]) // "6379") +
                        (if (((split("://")[1] // "") | split("/") | length) > 1)
                         then "/" + (((split("://")[1] // "") | split("/") | .[1:]) | join("/"))
                         else ""
                         end)
                      )
                    else . end
                  )
              )
          ')
          echo "$UPDATED" > /tmp/td-cron.json
          REV_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-cron.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster $CLUSTER --service $SERVICE_CRON --task-definition "$REV_ARN" --force-new-deployment
