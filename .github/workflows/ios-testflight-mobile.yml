name: iOS TestFlight (mobile)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wanzami_mobile_flutter/lib/**'
      - 'wanzami_mobile_flutter/ios/**'
      - 'wanzami_mobile_flutter/pubspec.yaml'
      - 'wanzami_mobile_flutter/pubspec.lock'
      - '.github/workflows/ios-testflight-mobile.yml'

concurrency:
  group: ios-testflight-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: '3.29.3'
      APP_DIR: wanzami_mobile_flutter
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('wanzami_mobile_flutter/pubspec.lock') }}

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY APPLE_TEAM_ID IOS_BUNDLE_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done

      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Set up manual code signing (if P12 cert is provided)
        if: ${{ env.IOS_SIGNING_CERTIFICATE_P12_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Create a temp keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import P12 certificate
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "${IOS_SIGNING_CERTIFICATE_P12_BASE64}" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "${IOS_SIGNING_CERTIFICATE_PASSWORD:-}" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profile (if provided)
          if [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            echo "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "$PP_PATH"
            PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}.mobileprovision"
            echo "IOS_PP_UUID=${PP_UUID}" >> "$GITHUB_ENV"
          fi

          echo "SIGNING_MODE=manual" >> "$GITHUB_ENV"

      - name: Set signing mode to automatic
        if: ${{ env.IOS_SIGNING_CERTIFICATE_P12_BASE64 == '' }}
        shell: bash
        run: echo "SIGNING_MODE=automatic" >> "$GITHUB_ENV"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APP_DIR }}/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('wanzami_mobile_flutter/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install iOS dependencies
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      - name: Write ExportOptions.plist
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE}" = "manual" ] && [ -n "${IOS_PP_UUID:-}" ]; then
            cat > "${APP_DIR}/ios/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PP_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          else
            cat > "${APP_DIR}/ios/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>authenticationKeyID</key>
            <string>${APP_STORE_CONNECT_KEY_ID}</string>
            <key>authenticationKeyIssuerID</key>
            <string>${APP_STORE_CONNECT_ISSUER_ID}</string>
            <key>allowProvisioningUpdates</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          fi

      - name: Build and archive iOS IPA
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          if [ "${SIGNING_MODE}" = "manual" ]; then
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/Runner.xcarchive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
              IPHONEOS_DEPLOYMENT_TARGET=13.0 \
              archive \
              -destination "generic/platform=iOS"
          else
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/Runner.xcarchive \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
              IPHONEOS_DEPLOYMENT_TARGET=13.0 \
              archive \
              -destination "generic/platform=iOS" \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
              -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
              -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"
          fi

          xcodebuild \
            -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Upload IPA to TestFlight
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"
            ls -la build/ios/ipa/ || true
            exit 1
          fi
          echo "Uploading: $IPA_PATH"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" \
            --verbose || \
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA_PATH" \
            -apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            -apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" \
            -v informational

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            wanzami_mobile_flutter/build/ios/ipa/*.ipa
            wanzami_mobile_flutter/build/Runner.xcarchive/
            wanzami_mobile_flutter/ios/ExportOptions.plist
          if-no-files-found: warn
