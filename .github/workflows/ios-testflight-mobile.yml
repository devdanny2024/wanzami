name: iOS TestFlight (mobile)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wanzami_mobile_flutter/lib/**'
      - 'wanzami_mobile_flutter/ios/**'
      - 'wanzami_mobile_flutter/pubspec.yaml'
      - 'wanzami_mobile_flutter/pubspec.lock'
      - '.github/workflows/ios-testflight-mobile.yml'

concurrency:
  group: ios-testflight-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: '3.29.3'
      APP_DIR: wanzami_mobile_flutter
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('wanzami_mobile_flutter/pubspec.lock') }}

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY APPLE_TEAM_ID IOS_BUNDLE_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret: $v"
              exit 1
            fi
          done

      - name: Provision signing via App Store Connect API
        shell: bash
        run: |
          set -euo pipefail

          # ── Write the API private key ──────────────────────────────────
          KEY_PATH="$RUNNER_TEMP/asc_api.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Also install for xcodebuild auto-signing fallback
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          # ── Generate JWT for App Store Connect REST API ────────────────
          NOW=$(date +%s)
          EXP=$((NOW + 600))
          HDR=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' \
            "$APP_STORE_CONNECT_KEY_ID" | \
            openssl base64 -A | tr -d '=' | tr '+/' '-_')
          PAY=$(printf '{"iss":"%s","iat":%d,"exp":%d,"aud":"appstoreconnect-v1"}' \
            "$APP_STORE_CONNECT_ISSUER_ID" "$NOW" "$EXP" | \
            openssl base64 -A | tr -d '=' | tr '+/' '-_')
          SIG=$(printf '%s.%s' "$HDR" "$PAY" | \
            openssl dgst -sha256 -sign "$KEY_PATH" -binary | \
            openssl base64 -A | tr -d '=' | tr '+/' '-_')
          JWT="${HDR}.${PAY}.${SIG}"

          asc_get() { curl -sf -H "Authorization: Bearer $JWT" "$@"; }
          asc_post() { curl -sf -X POST -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" -d "$2" "$1"; }

          # ── Create distribution certificate from a fresh CSR ──────────
          openssl ecparam -name prime256v1 -genkey -noout \
            -out "$RUNNER_TEMP/dist.key" 2>/dev/null
          openssl req -new -key "$RUNNER_TEMP/dist.key" \
            -out "$RUNNER_TEMP/dist.csr" \
            -subj "/CN=iPhone Distribution/O=${APPLE_TEAM_ID}/C=US" 2>/dev/null

          CSR_B64=$(openssl base64 -A -in "$RUNNER_TEMP/dist.csr")

          echo "Creating iOS Distribution certificate..."
          CERT_RESP=$(asc_post \
            "https://api.appstoreconnect.apple.com/v1/certificates" \
            "{\"data\":{\"type\":\"certificates\",\"attributes\":{\"certificateType\":\"IOS_DISTRIBUTION\",\"csrContent\":\"${CSR_B64}\"}}}" \
          ) || {
            echo "Certificate creation failed. Checking existing certificates..."
            EXISTING=$(asc_get \
              "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION&sort=-id&limit=1")
            CERT_COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])))")
            if [ "$CERT_COUNT" -gt 0 ]; then
              # Revoke oldest cert to free a slot then retry
              OLDEST_ID=$(asc_get \
                "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION&sort=id&limit=1" | \
                python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['id'])")
              echo "Revoking oldest certificate $OLDEST_ID to free a slot..."
              curl -sf -X DELETE \
                -H "Authorization: Bearer $JWT" \
                "https://api.appstoreconnect.apple.com/v1/certificates/$OLDEST_ID" || true
              # Retry certificate creation
              CERT_RESP=$(asc_post \
                "https://api.appstoreconnect.apple.com/v1/certificates" \
                "{\"data\":{\"type\":\"certificates\",\"attributes\":{\"certificateType\":\"IOS_DISTRIBUTION\",\"csrContent\":\"${CSR_B64}\"}}}")
            else
              echo "ERROR: Cannot create certificate and no existing certificate found." >&2
              exit 1
            fi
          }

          CERT_ID=$(echo "$CERT_RESP" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['id'])")
          CERT_CONTENT=$(echo "$CERT_RESP" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['attributes']['certificateContent'])")

          echo "$CERT_CONTENT" | base64 --decode > "$RUNNER_TEMP/dist.cer"
          openssl x509 -inform DER -in "$RUNNER_TEMP/dist.cer" \
            -out "$RUNNER_TEMP/dist.pem" 2>/dev/null
          P12_PASS="ci_$(uuidgen | tr -d '-')"
          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/dist.key" \
            -in "$RUNNER_TEMP/dist.pem" \
            -out "$RUNNER_TEMP/dist.p12" \
            -passout "pass:${P12_PASS}" 2>/dev/null
          echo "P12_PASS=${P12_PASS}" >> "$GITHUB_ENV"

          # Import into a dedicated keychain
          KC_PATH="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC_PATH"
          security list-keychain -d user -s "$KC_PATH"
          echo "KC_PATH=${KC_PATH}" >> "$GITHUB_ENV"

          # ── Get or create App Store provisioning profile ───────────────
          echo "Looking up bundle ID resource ID..."
          BUNDLE_RESP=$(asc_get \
            "https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=${IOS_BUNDLE_ID}&filter[platform]=IOS")
          BUNDLE_RID=$(echo "$BUNDLE_RESP" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['id'])")
          echo "Bundle resource ID: $BUNDLE_RID"

          echo "Creating App Store provisioning profile..."
          PROF_RESP=$(asc_post \
            "https://api.appstoreconnect.apple.com/v1/profiles" \
            "{\"data\":{\"type\":\"profiles\",\"attributes\":{\"name\":\"Wanzami AppStore CI $(date +%Y%m%d)\",\"profileType\":\"IOS_APP_STORE\"},\"relationships\":{\"bundleId\":{\"data\":{\"type\":\"bundleIds\",\"id\":\"${BUNDLE_RID}\"}},\"certificates\":{\"data\":[{\"type\":\"certificates\",\"id\":\"${CERT_ID}\"}]}}}}" \
          ) || {
            # Profile with same name may already exist — list and reuse latest
            echo "Profile creation failed, listing existing profiles..."
            PROF_RESP=$(asc_get \
              "https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&filter[name]=Wanzami%20AppStore%20CI&sort=-id&limit=1")
          }

          PROF_CONTENT=$(echo "$PROF_RESP" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); \
              data=d.get('data',{}); \
              data=data[0] if isinstance(data,list) else data; \
              print(data['attributes']['profileContent'])")

          echo "$PROF_CONTENT" | base64 --decode > "$RUNNER_TEMP/dist.mobileprovision"
          PP_UUID=$(security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" | \
            plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/dist.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}.mobileprovision"

          echo "PP_UUID=${PP_UUID}" >> "$GITHUB_ENV"
          echo "CERT_ID=${CERT_ID}" >> "$GITHUB_ENV"
          echo "Signing provisioned: cert=$CERT_ID, profile=$PP_UUID"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APP_DIR }}/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('wanzami_mobile_flutter/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install iOS dependencies
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      - name: Write ExportOptions.plist
        shell: bash
        run: |
          set -euo pipefail
          cat > "${APP_DIR}/ios/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${PP_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Build and archive iOS
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PP_UUID}" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            archive \
            -destination "generic/platform=iOS" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${KC_PATH}"

      - name: Export IPA
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            OTHER_CODE_SIGN_FLAGS="--keychain ${KC_PATH}"

      - name: Upload IPA to TestFlight
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found in build/ios/ipa"
            ls -la build/ios/ipa/ || true
            exit 1
          fi
          echo "Uploading: $IPA_PATH"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" \
            --verbose || \
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA_PATH" \
            -apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            -apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" \
            -v informational

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            wanzami_mobile_flutter/build/ios/ipa/*.ipa
            wanzami_mobile_flutter/ios/ExportOptions.plist
          if-no-files-found: warn
