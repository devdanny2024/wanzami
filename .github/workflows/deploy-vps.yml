name: Deploy backend (VPS)

# Ships the backend to the Hetzner VPS (single-box docker-compose stack that
# replaced AWS ECS). Source is rsync'd to the box, then the image is built there
# and the app containers are rolled. The legacy AWS pipeline (deploy.yml) is now
# manual-only; this is the live deploy path.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend source to VPS
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='docs' \
            --exclude='ops' \
            --exclude='backups' \
            --exclude='deploy/.env' \
            --exclude='.DEPLOYED_SHA' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            backend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/wanzami/"

      - name: Build & roll stack on VPS
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "WANZAMI_DIR=/root/wanzami GIT_SHA=${GITHUB_SHA} bash /root/wanzami/deploy/deploy.sh"
